# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: 'Token Analyzer MCP - Design Token System Validation & User Scenario Testing'

prompts:
  - '{{prompt}}'

providers:
  - id: azure:chat:gpt-5-mini
    config:
      reasoning:
        effort: 'medium'
      max_completion_tokens: 25000
      isReasoningModel: true
      mcp:
        enabled: true
        server:
          command: npx
          args:
            - '@fluentui-contrib/token-analyzer-mcp'
          name: test-token-mcp
  - id: azure:chat:o4-mini
    config:
      reasoning:
        effort: 'medium'
      max_completion_tokens: 25000
      isReasoningModel: true
      mcp:
        enabled: true
        server:
          command: npx
          args:
            - '@fluentui-contrib/token-analyzer-mcp'
          name: test-token-mcp

defaultTest:
  options:
    provider:
      id: azure:chat:gpt-5-mini
      config:
        isReasoningModel: true
        reasoning:
          effort: 'medium'
        max_completion_tokens: 25000

tests:
  - vars:
      prompt: >-
        Break down and explain each part of the token:
        group.toolbar.status.error.loud.rest
    assert:
      - type: llm-rubric
        value: >-
          Correct segmentation - The response correctly splits the token into
          its parts: group.component.proyperty.variant.style.state. If it's a
          control token, it should be
          ctrl.component.property.variant.style.state
      - type: llm-rubric
        value: >-
          Each segment is labeled with the correct semantic role
          (group.component is identified as the group)
      - type: llm-rubric
        value: >-
          Response provides quick explanation of each segment and what it
          represents in the design system

  - vars:
      prompt: >-
        Break down and explain each part of the token:
        group.toolbar.status.error.loud.rest
    assert:
      - type: answer-relevance
        value: >-
          Directness - Response directly addresses the prompt, focusing on
          breaking down and explaining the token
      - type: answer-relevance
        value: >-
          Coverage - all parts of the token that are relevant to this specific
          case are covered, no additional segments were covered because they
          weren't necessary in this case
      - type: answer-relevance
        value: >-
          Clarity - Answer is clear and understandable, with each parts meaning
          explained in context

  - vars:
      prompt: get tokens-structure://docs/token-rules.md
    options:
      storeOutputAs: tokenGuidanceDocument
    assert:
      - type: llm-rubric
        value: Should retrieve the token guidance document from the MCP.

  - vars:
      prompt: Show the fallback chain for group.toolbar.status.error.loud.rest
    assert:
      - type: llm-rubric
        value: >-
          Correctness - the response accurately traces the fallback path from
          the control token down to the primitive, all tokens should have a
          primitive as a common token assigned. It should follow the token
          schema rules as well.
      - type: llm-rubric
        value: >-
          Completeness - all intermediate steps in the fallback chain are
          included, no steps are skipped, unless it's irrelevant.
      - type: llm-rubric
        value: >-
          Clarity - each step in the fallback chain is clearly and concisely
          explained, with relationship between tokens defined.
      - type: llm-rubric
        value: >-
          Order - fall back chain is presented in the correct order, from most
          specific to least specific. Although sometimes a token can fall back
          to something within the same category (like a group to a group)

  - vars:
      prompt: 'Migrate the token colorStatusSuccessForeground1 to the new token schema'
    assert:
      - type: llm-rubric
        value: >-
          Schema compliance - Migrated token follows the new naming structure
          (ctrl / group.component.property.variant.style.state)
      - type: llm-rubric
        value: >-
          Semantic assignment - New token name assigns it a semantic, whether it
          is a Generic, Group, or Control token
      - type: llm-rubric
        value: >-
          Clarity - Response clearly explains how each segment of the old token
          maps to the new schema
      - type: llm-rubric
        value: >-
          Fallback reference - Response shows how the migrated token fits into
          the fallback chain
      - type: context-relevance
        value: >-
          Context - knows how to assign the the token schema based on resource
          list provided on new groups, token structure, and relevant
          documentation
