# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: 'My eval'

prompts:
  - '{{prompt}}'

providers:
  - id: azure:chat:gpt-5-mini
    config:
      reasoning:
        effort: 'medium'
      max_completion_tokens: 25000
      isReasoningModel: true
      mcp:
        enabled: true
        server:
          command: npx
          args:
            - '@fluentui-contrib/token-analyzer-mcp'
          name: test-token-mcp

defaultTest:
  options:
    provider:
      id: azure:chat:gpt-5-mini
      config:
        isReasoningModel: true
        reasoning:
          effort: 'medium'
        max_completion_tokens: 25000

tests:
  - vars:
      prompt: What tools are available to you?
    assert:
      - type: llm-rubric
        value: List of available tools should include list_resources and get_resource_data.

  - vars:
      prompt: What documentation is available for token documentation?
    assert:
      - type: llm-rubric
        value: Should include information about Fluent tokens, groups, colors, the button token group and overall guidance.

  - vars:
      prompt: What can you tell me about Fluent component token groups? Summarize.
    assert:
      - type: llm-rubric
        value: Should include information about token groups, their purpose, and how they relate to Fluent components. It shouldn't just be a list of available documents

  - description: 'Token name breakdown'
    provider:
      id: 'promptfoo:simulated-user'
      config:
        maxTurns: 10
    vars:
      scenario: 'token_name_breadkdown'
      instructions: |
        You're a user who wants to know about how the Fluent token `group.toolbar.status.error.loud.rest` breaks down. We know we have access to the token MCP and want to use that for our information.
        1. Get the list of token documentation resources and then pull the relevant documents using the MCP. You can pull all documents in a single request. Don't move on until the documentation is presented or loaded in context.
        2. Ask about each segment of the token name and the description of them to build understanding of the token.
        3. Ask where a token like this might be used and which component.
    assert:
      # Overall conversation quality
      - type: llm-rubric
        value: |
          Evaluate the complete conversation on:
          - Problem resolution effectiveness (0-10)
          - Tool usage appropriateness (0-10)
          - Context maintenance across turns (0-10)
          - Customer satisfaction outcome (0-10)
        weight: 3
